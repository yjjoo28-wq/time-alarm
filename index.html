<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>잠일고 이동수업 마스터</title>
    <!-- Stylesheets -->
    <link rel="stylesheet" href="./style.css" />
    <!-- Tailwind CSS v3 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              blue: {
                450: '#60a5fa',
                650: '#2563eb',
                955: '#172554',
              },
              zinc: {
                750: '#27272a',
                805: '#1e1e24',
                850: '#141416',
              },
              amber: {
                955: '#451a03',
              }
            }
          }
        }
      }
    </script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Core Application Interactions (Deferred) -->
    <script src="./script.js" defer></script>
  </head>
  <body class="m-0 p-0 antialiased font-sans">
    
    <!-- MASTER CONTAINER -->
    <div id="master_container" class="min-h-screen py-6 px-4 md:py-10 bg-slate-50 text-zinc-805 transition-colors duration-300">
      
      <!-- MASTER CARD SHELL -->
      <div id="master_card" class="max-w-md mx-auto rounded-3xl overflow-hidden flex flex-col border border-zinc-100 bg-white shadow-sm transition-all duration-300">
        
        <!-- HEADER MODULE -->
        <header id="app_header" class="px-6 pt-6 pb-4 border-b border-zinc-100 bg-white transition-all duration-300">
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3.5">
              <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 to-sky-500 flex items-center justify-center text-white font-extrabold select-none shadow-md shadow-blue-500/20 active:scale-95 transition-transform">
                🏫
              </div>
              <div>
                <h1 class="text-base font-black tracking-tight flex items-center space-x-1.5 leading-tight">
                  <span>잠일고 이동수업 마스터</span>
                </h1>
                <p class="text-[11px] font-bold text-zinc-400 mt-0.5 leading-none">
                  실시간 과목 & 타이머 서비스
                </p>
              </div>
            </div>

            <!-- CONTROLS ROW -->
            <div class="flex items-center space-x-1.5">
              <!-- Dark Mode Switcher -->
              <button 
                id="dark_mode_toggle_btn" 
                class="p-2 rounded-xl border border-zinc-100 text-zinc-400 hover:text-amber-500 hover:bg-amber-50 hover:border-amber-100 transition-all active:scale-95 cursor-pointer"
                title="다크 모드 / 라이트 모드 전환"
              >
                <!-- SVG injected dynamically by script -->
              </button>

              <!-- Play Westminster School Bell -->
              <button 
                id="bell_chime_btn" 
                class="p-2 rounded-xl border border-zinc-100 text-zinc-400 hover:text-blue-600 hover:bg-blue-50/50 transition-all active:scale-95 cursor-pointer"
                title="수동 Westminster 학교종 시뮬레이션 타종"
              >
                <i data-lucide="bell" class="w-4 h-4"></i>
              </button>

              <!-- Sound Chimes Toggle -->
              <button 
                id="sound_toggle_btn" 
                class="p-2 rounded-xl border transition-all active:scale-95 cursor-pointer"
                title="교시 변경 시 Westminster 자동 타종 종소리 활성/비활성"
              >
                <i data-lucide="volume-2" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        </header>

        <!-- TIMER COUNTDOWN STAGE -->
        <main id="timer_stage" class="px-6 py-6 border-b border-zinc-100 bg-zinc-50/40 transition-all duration-300">
          <div class="flex items-center justify-between">
            <span id="live_clock_text" class="text-xs font-mono font-bold text-zinc-400 tracking-tight">
              오전 00:00:00
            </span>
            <span id="test_badge" class="hidden px-2 py-0.5 rounded-full bg-amber-500 text-white font-mono text-[9px] font-extrabold flex items-center space-x-1 animate-pulse">
              <span>●</span>
              <span>TEST VIRTUAL MODE</span>
            </span>
          </div>

          <!-- Active stage indicator state -->
          <div class="mt-4 flex flex-col">
            <span id="stage_title_span" class="text-sm font-black tracking-tight text-blue-600 dark:text-blue-400">
              과목 검색 분석 계산 중
            </span>
            <div id="stage_sub_span" class="mt-1 flex items-center space-x-1.5 text-xs text-zinc-500 font-semibold">
              <!-- Dynamically rendered active course details -->
            </div>
          </div>

          <!-- Gigantic Clock face -->
          <div class="flex flex-col items-center justify-center py-5">
            <span id="countdown_clock_display" class="my-2 select-all font-mono text-6xl font-black tracking-tight text-zinc-950">
              --:--
            </span>
            <span id="target_label_indicator" class="text-[11px] font-bold text-zinc-400 tracking-tight text-center">
              일과 시작 대기 중
            </span>
          </div>

          <!-- Live Visual progress slider bar -->
          <div class="w-full h-2 rounded-full overflow-hidden bg-zinc-200/60 dark:bg-zinc-800/80 mb-2 mt-1">
            <div id="visual_timeline_bar" class="h-full rounded-full bg-blue-600 transition-all duration-1000 ease-out" style="width: 0%"></div>
          </div>
          <div id="progress_labels_desc" class="flex justify-between text-[10px] font-mono font-semibold text-zinc-400 leading-none">
            <!-- Percent markers -->
          </div>
        </main>

        <!-- WEEKDAY TABS NAVIGATION -->
        <nav id="weekly_tab_nav" class="px-6 pt-5 pb-1 bg-white transition-all duration-300">
          <div class="flex justify-between items-center mb-3">
            <span class="text-[11px] font-bold text-zinc-400 uppercase tracking-wider flex items-center">
              <i data-lucide="calendar" class="w-3.5 h-3.5 text-blue-600 mr-1.5 inline-block"></i>
              <span>요일별 이동식 시간표</span>
            </span>
          </div>

          <div class="grid grid-cols-5 gap-1.5 p-1 rounded-xl bg-zinc-100/60 dark:bg-zinc-950/40">
            <button id="tab_day_1" type="button" class="py-2 text-xs font-bold rounded-lg transition-all relative">월</button>
            <button id="tab_day_2" type="button" class="py-2 text-xs font-bold rounded-lg transition-all relative">화</button>
            <button id="tab_day_3" type="button" class="py-2 text-xs font-bold rounded-lg transition-all relative">수</button>
            <button id="tab_day_4" type="button" class="py-2 text-xs font-bold rounded-lg transition-all relative">목</button>
            <button id="tab_day_5" type="button" class="py-2 text-xs font-bold rounded-lg transition-all relative">금</button>
          </div>
        </nav>

        <!-- SUBJECT PERIODS ROW VIEWS -->
        <section id="list_view_section" class="px-6 pb-6 flex-1 bg-white transition-all duration-300">
          <div id="timetable_rows_container" class="space-y-2 mt-3.5">
            <!-- Dynamic Period cards injected via JS -->
          </div>
        </section>

        <!-- COLLAPSIBLE SIMULATOR CONTROLLER (TEST MODE) -->
        <section id="simulator_dock" class="border-t border-zinc-100 bg-zinc-50/80 p-5 transition-all duration-300">
          <div class="flex items-center justify-between mb-3">
            <button id="toggle_mock_mode_btn" class="flex items-center space-x-2 text-xs font-bold transition-colors cursor-pointer">
              <i data-lucide="sliders" class="w-3.5 h-3.5 text-blue-600"></i>
              <span>💻 실시간 시간표 동작 테스트 모드</span>
            </button>
            <div class="flex items-center space-x-2">
              <button id="reset_mock_time_btn" title="테스트 기본값 리셋" class="p-1 hover:bg-zinc-200/60 text-zinc-500 rounded transition-colors cursor-pointer">
                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
              </button>
              <span id="test_indicator_dot" class="w-2.5 h-2.5 rounded-full bg-zinc-300"></span>
            </div>
          </div>

          <div id="mock_controllers_block" class="hidden space-y-4 p-4 rounded-2xl border border-zinc-150/40 bg-white/70 dark:bg-zinc-900/60 shadow-xs transition-all duration-300">
            <!-- Weekday tests -->
            <div>
              <label class="text-[11px] font-bold text-zinc-400 block mb-1.5 uppercase">테스트 요일 선택</label>
              <div class="grid grid-cols-5 gap-1.5">
                <button id="mock_day_btn_1" type="button" class="py-1 text-xs font-semibold rounded-md border text-zinc-650 bg-zinc-50 border-zinc-200 hover:bg-zinc-100 cursor-pointer">월</button>
                <button id="mock_day_btn_2" type="button" class="py-1 text-xs font-semibold rounded-md border text-zinc-650 bg-zinc-50 border-zinc-200 hover:bg-zinc-100 cursor-pointer">화</button>
                <button id="mock_day_btn_3" type="button" class="py-1 text-xs font-semibold rounded-md border text-zinc-650 bg-zinc-50 border-zinc-200 hover:bg-zinc-100 cursor-pointer">수</button>
                <button id="mock_day_btn_4" type="button" class="py-1 text-xs font-semibold rounded-md border text-zinc-650 bg-zinc-50 border-zinc-200 hover:bg-zinc-100 cursor-pointer">목</button>
                <button id="mock_day_btn_5" type="button" class="py-1 text-xs font-semibold rounded-md border text-zinc-650 bg-zinc-50 border-zinc-200 hover:bg-zinc-100 cursor-pointer">금</button>
              </div>
            </div>

            <!-- Virtual Slider -->
            <div>
              <div class="flex justify-between items-center mb-1">
                <label class="text-[11px] font-bold text-zinc-400 uppercase">가상 시간 조정</label>
                <span id="test_minutes_output" class="font-mono text-xs font-bold text-blue-600">09:15</span>
              </div>
              <input 
                id="mock_minutes_range"
                type="range"
                min="460"
                max="980"
                step="1"
                class="w-full h-1.5 bg-zinc-200 rounded-lg appearance-none cursor-ew-resize accent-blue-600 focus:outline-none"
                value="555"
              />
              <div class="flex justify-between text-[9px] font-mono text-zinc-400 mt-1">
                <span>07:40 등교전</span>
                <span>점심 (12:00)</span>
                <span>16:20 방과후</span>
              </div>
            </div>

            <!-- Presets lists -->
            <div>
              <label class="text-[11px] font-bold text-zinc-400 block mb-1.5 uppercase">원클릭 시나리오 사전 세팅</label>
              <div class="flex flex-wrap gap-1">
                <button id="preset_scen_0" type="button" class="px-2.5 py-1 bg-zinc-50 hover:bg-zinc-100 border border-zinc-150 text-[11px] rounded text-zinc-650 font-semibold cursor-pointer">1교시 전 (08:00)</button>
                <button id="preset_scen_1" type="button" class="px-2.5 py-1 bg-zinc-50 hover:bg-zinc-100 border border-zinc-150 text-[11px] rounded text-zinc-650 font-semibold cursor-pointer">1교시 수업 (08:25)</button>
                <button id="preset_scen_2" type="button" class="px-2.5 py-1 bg-zinc-50 hover:bg-zinc-100 border border-zinc-150 text-[11px] rounded text-zinc-650 font-semibold cursor-pointer">쉬는 시간 (10:04)</button>
                <button id="preset_scen_3" type="button" class="px-2.5 py-1 bg-zinc-50 hover:bg-zinc-100 border border-zinc-150 text-[11px] rounded text-zinc-650 font-semibold cursor-pointer">🍱 점심시간 (12:20)</button>
                <button id="preset_scen_4" type="button" class="px-2.5 py-1 bg-zinc-50 hover:bg-zinc-100 border border-zinc-150 text-[11px] rounded text-zinc-650 font-semibold cursor-pointer">7교시 수업 (15:15)</button>
                <button id="preset_scen_5" type="button" class="px-2.5 py-1 bg-zinc-50 hover:bg-zinc-100 border border-zinc-150 text-[11px] rounded text-zinc-650 font-semibold cursor-pointer">하교 후 (16:10)</button>
              </div>
            </div>
          </div>

          <div class="mt-3.5 flex justify-between items-center text-[10px] text-zinc-400 px-1 font-medium select-none">
            <span>잠일고 1인 맞춤형 이동수업 웹앱</span>
            <span>v1.3 - Static Web App</span>
          </div>
        </section>

      </div>
    </div>

    <!-- MAIN SCHOOL MAP SELECTOR MODAL (MOUNT POINT) -->
    <div 
      id="map_selector_modal_overlay" 
      class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-xxs animate-fadeIn"
    >
      <div id="map_card_shell" class="w-full max-w-sm rounded-3xl overflow-hidden flex flex-col border shadow-2xl transition-all duration-300 max-h-[90vh]">
        
        <!-- Modal Header -->
        <div class="p-5 pb-4 border-b flex items-center justify-between border-zinc-100 dark:border-zinc-800">
          <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-xl bg-blue-605 bg-blue-600 flex items-center justify-center text-white font-bold select-none text-sm shadow-md">
              🗺️
            </div>
            <div>
              <h3 class="text-sm font-black tracking-tight flex items-center space-x-1.5 leading-none">
                <span>교실 위치 지도 선택</span>
                <span id="modal_period_tag" class="text-[10px] bg-blue-105 bg-blue-50 dark:bg-blue-955 text-blue-600 dark:text-blue-400 font-extrabold px-1.5 py-0.5 rounded-sm">
                  1교시
                </span>
              </h3>
              <p class="text-[11px] font-bold text-zinc-400 mt-1 leading-none">
                과정 과목: <span id="modal_subject_tag" class="text-blue-600 dark:text-blue-400 font-extrabold">공통과학</span>
              </p>
            </div>
          </div>
          <button 
            id="modal_close_btn"
            type="button"
            class="p-2 rounded-lg border border-zinc-150 dark:border-zinc-800 hover:bg-zinc-100 dark:hover:bg-zinc-800 text-zinc-400 transition-colors cursor-pointer"
          >
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- Modal Body Content -->
        <div class="p-5 overflow-y-auto space-y-4 flex-1">
          <!-- Interior Search header control -->
          <div class="relative">
            <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-zinc-400"></i>
            <input 
              id="modal_search_input"
              type="text"
              placeholder="호실명 또는 용도 검색... (예: 미술, 뉴턴, 도서)"
              class="w-full pl-9 pr-9 py-2 text-xs rounded-xl border focus:outline-none"
            />
            <button 
              id="modal_search_clear_btn"
              type="button"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-zinc-650 cursor-pointer"
            >
              <i data-lucide="x" class="w-3 h-3"></i>
            </button>
          </div>

          <!-- Dynamic map navigation sections target -->
          <div id="modal_dynamic_map_section">
            <!-- Reconstructed via JS depending on view type -->
          </div>

          <!-- Showcase selecting -->
          <div id="modal_selection_showcase" class="hidden">
            <!-- Selected room details badge -->
          </div>

          <!-- Direct Text Manual fallback -->
          <div>
            <label class="text-[10px] font-black text-zinc-400 block mb-1 uppercase leading-none">지도 외 수동 입력 (비선호 호실)</label>
            <div class="flex space-x-1.5">
              <input 
                id="modal_manual_text_input"
                type="text"
                maxlength="15"
                placeholder="교실 명칭 직접 입력 (예: 잔디운동장, 동아리B실)"
                class="w-full px-3 py-1.8 text-xs rounded-xl border focus:outline-none focus:ring-1 font-bold"
              />
            </div>
          </div>

          <!-- Popular keywords preset taggers -->
          <div>
            <span class="text-[10px] font-black text-zinc-400 block mb-1 uppercase leading-none">자주 쓰이는 키워드</span>
            <div id="modal_popular_presets" class="flex flex-wrap gap-1">
              <!-- Reconstructed keywords -->
            </div>
          </div>
        </div>

        <!-- Modal Actions Footer -->
        <div class="p-4 border-t flex justify-end space-x-1.5 border-zinc-100 dark:border-zinc-800 bg-zinc-50/20 dark:bg-zinc-950/40">
          <button 
            id="modal_cancel_btn"
            type="button"
            class="px-4 py-1.8 text-xs font-bold rounded-xl border border-zinc-200 dark:border-zinc-800 hover:bg-zinc-100 dark:hover:bg-zinc-800 text-zinc-500 dark:text-zinc-300 transition-all cursor-pointer"
          >
            취소
          </button>
          <button 
            id="modal_save_btn"
            type="button"
            class="px-4.5 py-1.8 text-xs font-bold rounded-xl bg-blue-600 hover:bg-blue-700 text-white transition-all shadow-md active:scale-95 cursor-pointer"
          >
            저장하기
          </button>
        </div>

      </div>
    </div>

  </body>
</html>
